name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'ImmortalWrt 仓库的拥有者 (Owner of ImmortalWrt repo)'
        type: string
        required: true
        default: 'a757814283'
      repo:
        description: 'ImmortalWrt 仓库的名字 (Name of ImmortalWrt repo)'
        type: string
        required: true
        default: 'immortalwrt_mt5000'
      branch:
        description: 'ImmortalWrt 仓库的分支 (Branch of ImmortalWrt repo)'
        type: string
        required: true
        default: 'openwrt-25.12'
      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true
      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

# 发布 Release 需要写入 contents；默认 GITHUB_TOKEN 对 public 仓库只有只读权限
# Publishing a release needs contents: write — the default token is read-only on public repos
permissions:
  contents: write

jobs:
  build:
    if: ${{inputs.ssh == false}}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)
    steps:
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4
        with:
          repository: ${{github.repository}}
          ref: ${{github.ref_name}}

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: '${{inputs.owner}}/${{inputs.repo}}'
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 复制当前仓库的配置文件到 ImmortalWrt 仓库  (Copy current repo config to ImmortalWrt repo)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并下载 feeds (Update and download feeds)
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 再次复制当前仓库的配置文件到 ImmortalWrt 仓库 (Copy current repo config to ImmortalWrt repo again)
        run: cp -f .config feeds.conf.default diy.sh ImmortalWrt/

      - name: 编译前上传配置 (Upload config before build)
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets

      # ---- 以下是自动发布 Release 的部分 (Automatic release publishing) ----

      - name: 汇总固件文件 (Collect firmware files)
        run: |
          set -euo pipefail
          mkdir -p firmware

          # 从 target 目录一路收敛到设备目录，把设备目录下的产物去重汇总。
          # 设备目录里的 sysupgrade.bin / factory.img 等正是要发布的文件，
          # 而 bin/targets 里其余的 packages/ 与临时 .buildinfo 不需要。
          target_dir='ImmortalWrt/bin/targets'
          if [ ! -d "$target_dir" ]; then
            echo "::error::$target_dir 不存在，编译可能失败 (build output missing)"
            exit 1
          fi

          find "$target_dir" -mindepth 1 -maxdepth 3 -type d -print0 \
            | xargs -0 -r -I{} sh -c '
                # packages/ 里的 .ipk 有上百 MB，且不是刷机产物，必须排除。
                # 注意判断的是完整路径：目录里的文件名本身不含 "packages"。
                case "$1" in
                  */packages/*|*/packages) exit 0 ;;
                esac
                for f in "$1"/*; do
                  [ -f "$f" ] || continue
                  case "$(basename "$f")" in
                    *.buildinfo) continue ;;
                  esac
                  cp -n "$f" firmware/ 2>/dev/null || true
                done
              ' _ {} || true

          count=$(find firmware -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有收集到任何固件文件，停止发布 (no firmware artifacts found)"
            exit 1
          fi
          echo "收集到 $count 个固件文件 (collected $count firmware files)"
          ls -lh firmware

      - name: 生成发布标签 (Generate release tag)
        id: tag
        run: |
          echo "name=ImmortalWrt-Photonicat1-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release (Publish to Release)
        # 仅在 main 分支上发布；从其他分支触发只编译、不发布。
        # 想让任意分支都发布就把下面这行 if 删掉。
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{steps.tag.outputs.name}}
          name: ${{steps.tag.outputs.name}}
          body: |
            自动编译发布 (Automated build)

            - 触发分支 (Branch): `${{github.ref_name}}`
            - 提交 (Commit): `${{github.sha}}`
            - ImmortalWrt 源码 (Source): `${{inputs.owner}}/${{inputs.repo}}@${{inputs.branch}}`
          files: firmware/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  build-ssh:
    if: ${{inputs.ssh == true}}
    name: 🚀 编译 (Build) - SSH
    runs-on: ubuntu-latest
    steps:
      - name: 下载编译所需的依赖 (Install the software packages required for compilation)
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4
        with:
          repository: ${{github.repository}}
          ref: ${{github.ref_name}}

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: '${{inputs.owner}}/${{inputs.repo}}'
          ref: ${{inputs.branch}}
          path: ImmortalWrt

      - name: 开启 SSH 服务 (Start SSH service)
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

#      # 你也可以使用这个，个人觉得它更好用 (You can use this, I personally think it is better)
#      - name: 开启 SSH 服务 (Start SSH service)
#        uses: mxschmitt/action-tmate@v3
#        timeout-minutes: 15

      - name: 编译前上传配置 (Upload config before build)
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt multithreading)
        if: ${{inputs.multithreading == true}}
        working-directory: ImmortalWrt
        run: make -j$(nproc) V=s

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt single thread)
        if: ${{inputs.multithreading == false}}
        working-directory: ImmortalWrt
        run: make -j1 V=s

      - name: 上传编译结果到 Artifact (Upload build result to Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets

      # ---- 以下是自动发布 Release 的部分 (Automatic release publishing) ----

      - name: 汇总固件文件 (Collect firmware files)
        run: |
          set -euo pipefail
          mkdir -p firmware

          # 从 target 目录一路收敛到设备目录，把设备目录下的产物去重汇总。
          # 设备目录里的 sysupgrade.bin / factory.img 等正是要发布的文件，
          # 而 bin/targets 里其余的 packages/ 与临时 .buildinfo 不需要。
          target_dir='ImmortalWrt/bin/targets'
          if [ ! -d "$target_dir" ]; then
            echo "::error::$target_dir 不存在，编译可能失败 (build output missing)"
            exit 1
          fi

          find "$target_dir" -mindepth 1 -maxdepth 3 -type d -print0 \
            | xargs -0 -r -I{} sh -c '
                # packages/ 里的 .ipk 有上百 MB，且不是刷机产物，必须排除。
                # 注意判断的是完整路径：目录里的文件名本身不含 "packages"。
                case "$1" in
                  */packages/*|*/packages) exit 0 ;;
                esac
                for f in "$1"/*; do
                  [ -f "$f" ] || continue
                  case "$(basename "$f")" in
                    *.buildinfo) continue ;;
                  esac
                  cp -n "$f" firmware/ 2>/dev/null || true
                done
              ' _ {} || true

          count=$(find firmware -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有收集到任何固件文件，停止发布 (no firmware artifacts found)"
            exit 1
          fi
          echo "收集到 $count 个固件文件 (collected $count firmware files)"
          ls -lh firmware

      - name: 生成发布标签 (Generate release tag)
        id: tag
        run: |
          echo "name=ImmortalWrt-Photonicat1-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release (Publish to Release)
        # 仅在 main 分支上发布；从其他分支触发只编译、不发布。
        # 想让任意分支都发布就把下面这行 if 删掉。
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{steps.tag.outputs.name}}
          name: ${{steps.tag.outputs.name}}
          body: |
            自动编译发布 (Automated build)

            - 触发分支 (Branch): `${{github.ref_name}}`
            - 提交 (Commit): `${{github.sha}}`
            - ImmortalWrt 源码 (Source): `${{inputs.owner}}/${{inputs.repo}}@${{inputs.branch}}`
          files: firmware/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
